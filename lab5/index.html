<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-id="th-modified">二林工商小達人問答</title>
    
    <!-- 引入 Tailwind CSS 進行排版與美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome 提供精美圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 React 核心套件 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 讓瀏覽器可以直接看懂 React 語法 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<meta property="og:title" content="二林工商小達人問答" data-id="th-modified" ><meta name="description" content="index" data-id="th-modified" ><meta property="og:description" content="index" data-id="th-modified" ><meta property="og:image" content="https://tiiny.host/assets/logo-purple-bg.png" data-id="th-modified" ><meta property="og:image:width" content="1501" data-id="th-modified" ><meta property="og:image:height" content="1501" data-id="th-modified" ><meta property="og:image:type" content="image/png" data-id="th-modified" ><meta property="og:url" content="https://erlin-quiz.tiiny.site/" data-id="th-modified" ><meta property="og:type" content="website" data-id="th-modified" ><script defer data-domain="erlin-quiz.tiiny.site" src="https://analytics.tiiny.site/js/plausible.js"></script></head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-indigo-100">

    <!-- 網頁的掛載點 -->
    <div id="root" class="w-full max-w-md flex justify-center"></div>

    <!-- 遊戲主程式 -->
    <script type="text/babel">
        const { useState } = React;

        // 定義 10 道題目 (依照您的要求：第一題地理位置，最後一題技職之光)
        const questions = [
          {
            icon: <i className="fa-solid fa-location-dot text-2xl text-blue-500"></i>,
            title: "國立二林工商位於彰化縣的哪一個鄉鎮？",
            options: ["鹿港鎮", "二林鎮", "員林市", "北斗鎮"],
            answerIndex: 1,
            explanation: "沒錯！二林工商就位於彰化縣二林鎮，是當地重要的高級職業學校。"
          },
          {
            icon: <i className="fa-solid fa-computer text-2xl text-indigo-400"></i>,
            title: "想要學習「跨境電商、程式設計、影音多媒體應用」，並考取電腦軟體應用與網頁設計證照，應該加入哪個大家庭？",
            options: ["商業經營科", "機械科", "資料處理科", "電子科"],
            answerIndex: 2,
            explanation: "答對了！「資料處理科」致力培育跨境電商、程式設計與多媒體應用的專業人才，並輔導學生考取多項國家級檢定證照。"
          },
          {
            icon: <i className="fa-solid fa-calculator text-2xl text-emerald-500"></i>,
            title: "想要學習「會計、經濟學、門市服務」等商業知識，適合就讀哪一科？",
            options: ["機電科", "商業經營科", "體育班", "綜合高中"],
            answerIndex: 1,
            explanation: "答對了！「商業經營科」專門培養企業管理、會計與行銷的專業人才。"
          },
          {
            icon: <i className="fa-solid fa-ruler-combined text-2xl text-pink-500"></i>,
            title: "夢想成為室內設計師，學習「室內模型製作、家具木工、電腦繪圖」，哪一科最適合你？",
            options: ["室內空間設計科", "建築科", "電子科", "機械科"],
            answerIndex: 0,
            explanation: "正確！「室內空間設計科」(及實用技能班裝潢技術科) 專精於空間美學、裝修設計與木作技能。"
          },
          {
            icon: <i className="fa-solid fa-bolt text-2xl text-yellow-500"></i>,
            title: "想學習「室內配線、工業配線、馬達控制」等高低壓電力技術，掌握能源命脈，首選是？",
            options: ["電子科", "電機科", "資料處理科", "建築科"],
            answerIndex: 1,
            explanation: "沒錯！「電機科」主要培育電力系統、馬達控制與自動化控制的專業人才。"
          },
          {
            icon: <i className="fa-solid fa-building text-2xl text-orange-500"></i>,
            title: "如果你對「房屋結構、測量、工程製圖」有興趣，應該選擇二林工商的哪一科？",
            options: ["電機科", "資料處理科", "建築科", "機械科"],
            answerIndex: 2,
            explanation: "正確！「建築科」主要培育建築設計、施工與測量的專業人才。"
          },
          {
            icon: <i className="fa-solid fa-screwdriver-wrench text-2xl text-slate-500"></i>,
            title: "喜歡動手操作機器，學習「車床、電腦輔助製造(CNC)」等技術，是哪一科的強項？",
            options: ["機械科", "商業經營科", "裝潢技術科", "應用外語科"],
            answerIndex: 0,
            explanation: "賓果！「機械科」正是學習精密機械加工與製造技術的科系。"
          },
          {
            icon: <i className="fa-solid fa-microchip text-2xl text-cyan-500"></i>,
            title: "對「電路板焊接、物聯網(IoT)、微電腦控制」有濃厚興趣，想成為電子工程師，該選哪一科？",
            options: ["電子科", "電機科", "機械科", "土木科"],
            answerIndex: 0,
            explanation: "正確！「電子科」專注於電子電路、數位邏輯與微處理機的應用技術。"
          },
          {
            icon: <i className="fa-solid fa-dumbbell text-2xl text-purple-500"></i>,
            title: "二林工商體育班表現優異，培育許多國手。請問學校重點發展的「三大體育專長」是哪些？",
            options: ["籃球、游泳、柔道", "排球、舉重、拳擊", "棒球、足球、田徑", "羽球、網球、劍道"],
            answerIndex: 1,
            explanation: "正解！二林工商在「排球、舉重、拳擊」項目上成績斐然，是國內培育體育人才的重要搖籃。"
          },
          {
            icon: <i className="fa-solid fa-star text-2xl text-yellow-400"></i>,
            title: "2024年底，二林工商裝潢技術科校友陳聖傑，因考取多張乙級證照，榮獲了教育部的哪項最高榮譽？",
            options: ["金馬獎", "師鐸獎", "技職之光", "諾貝爾獎"],
            answerIndex: 2,
            explanation: "太強了！陳聖傑校友榮獲第20屆「技職之光」證照達人獎，是二林工商創校以來首位獲獎者！"
          }
        ];

        function App() {
          // 新增狀態：判斷是否已經點擊「開始挑戰」
          const [hasStarted, setHasStarted] = useState(false);
          
          // 測驗相關狀態
          const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);
          const [score, setScore] = useState(0);
          const [showResult, setShowResult] = useState(false);

          const currentQuestion = questions[currentQuestionIndex];
          const optionLabels = ['A', 'B', 'C', 'D'];

          const handleOptionClick = (index) => {
            if (isAnswered) return;
            
            setSelectedOption(index);
            setIsAnswered(true);
            
            if (index === currentQuestion.answerIndex) {
              setScore(score + 1);
            }
          };

          const handleNextQuestion = () => {
            if (currentQuestionIndex < questions.length - 1) {
              setCurrentQuestionIndex(currentQuestionIndex + 1);
              setSelectedOption(null);
              setIsAnswered(false);
            } else {
              setShowResult(true);
            }
          };

          const restartQuiz = () => {
            setCurrentQuestionIndex(0);
            setSelectedOption(null);
            setIsAnswered(false);
            setScore(0);
            setShowResult(false);
            // 重新開始時，退回封面
            setHasStarted(false); 
          };

          // 選項按鈕的樣式邏輯
          const getOptionStyle = (index) => {
            if (!isAnswered) {
              return selectedOption === index 
                ? "border-gray-400 bg-gray-100" 
                : "border-gray-100 bg-gray-50 hover:bg-gray-100";
            }
            if (index === currentQuestion.answerIndex) {
              return "border-green-500 bg-green-50 z-10 shadow-sm"; 
            }
            if (index === selectedOption && index !== currentQuestion.answerIndex) {
              return "border-red-400 bg-red-50 z-10 shadow-sm text-red-700"; 
            }
            return "border-gray-100 bg-gray-50 opacity-50"; 
          };

          // 1. 首頁封面 (尚未開始時顯示)
          if (!hasStarted) {
            return (
              <div className="bg-white rounded-[2rem] w-full p-8 shadow-2xl text-center flex flex-col items-center justify-center py-16 relative overflow-hidden">
                {/* 裝飾性背景光暈 */}
                <div className="absolute top-0 left-0 w-full h-48 bg-gradient-to-b from-indigo-50 to-white -z-10"></div>
                
                <div className="bg-indigo-100 w-24 h-24 rounded-full flex items-center justify-center mb-6 shadow-inner">
                  <i className="fa-solid fa-school text-indigo-600 text-4xl"></i>
                </div>
                
                <h1 className="text-3xl font-bold text-slate-800 mb-8 tracking-wide">二林工商小達人</h1>
                
                <div className="text-slate-600 space-y-2 mb-10 text-[1.1rem]">
                  <p>挑戰 <span className="text-indigo-600 font-bold">10</span> 道題目</p>
                  <p>全方位認識二林工商的</p>
                  <p><span className="text-indigo-600 font-bold">八大科系</span> 與 <span className="text-indigo-600 font-bold">榮譽事蹟</span> ！</p>
                </div>

                <button 
                  onClick={() => setHasStarted(true)}
                  className="w-full bg-[#5C55E5] hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 mt-4 text-lg"
                >
                  開始挑戰 <i className="fa-solid fa-arrow-right"></i>
                </button>
              </div>
            );
          }

          // 2. 測驗結算畫面
          if (showResult) {
            return (
              <div className="bg-white rounded-[2rem] w-full p-8 shadow-2xl text-center py-12">
                <div className="flex justify-center mb-6">
                  <div className="bg-yellow-100 p-6 rounded-full inline-flex items-center justify-center">
                    <i className="fa-solid fa-trophy text-6xl text-yellow-500"></i>
                  </div>
                </div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">測驗完成！</h2>
                <p className="text-gray-500 mb-6">你是真正的二林工商小達人嗎？</p>
                
                <div className="text-6xl font-black text-indigo-600 mb-2">
                  {score} <span className="text-2xl text-gray-400">/ 10</span>
                </div>
                
                <p className="text-lg text-gray-700 font-medium mb-8 mt-4 px-2">
                  {score === 10 ? "太神啦！你根本是二林工商地下校長！ 🎉" : 
                   score >= 7 ? "很厲害喔！對學校有相當程度的了解！ 👍" : 
                   "再接再厲！看來還有很多科系等你探索喔！ 💪"}
                </p>

                <button 
                  onClick={restartQuiz}
                  className="w-full bg-[#5C55E5] hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-colors flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-rotate-right text-lg"></i>
                  回到首頁
                </button>
              </div>
            );
          }

          // 3. 測驗進行中的畫面
          return (
            <div className="bg-white rounded-[2rem] w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh] sm:max-h-[95vh]">
              <div className="px-6 py-4 flex items-center justify-between border-b border-gray-100 bg-white sticky top-0 z-20">
                <h1 className="text-lg font-bold text-gray-800">二林工商小達人</h1>
                <div className="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full text-sm font-bold">
                  {currentQuestionIndex + 1} / {questions.length}
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-6 scroll-smooth pb-32">
                <div className="flex items-start gap-4 mb-8">
                  <div className="bg-gray-50 p-3 rounded-2xl shrink-0 border border-gray-100 shadow-sm flex items-center justify-center min-w-[3rem] min-h-[3rem]">
                    {currentQuestion.icon}
                  </div>
                  <h2 className="text-xl font-bold text-gray-800 leading-relaxed pt-1">
                    {currentQuestion.title}
                  </h2>
                </div>

                <div className="space-y-3 mb-8">
                  {currentQuestion.options.map((option, index) => {
                    const isCorrectOption = index === currentQuestion.answerIndex;
                    const isSelectedOption = index === selectedOption;
                    
                    return (
                      <button
                        key={index}
                        onClick={() => handleOptionClick(index)}
                        disabled={isAnswered}
                        className={`w-full text-left p-4 rounded-2xl border-2 transition-all duration-200 flex items-center gap-4 group ${getOptionStyle(index)}`}
                      >
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 border transition-colors
                          ${isAnswered && isCorrectOption ? 'bg-green-500 border-green-500 text-white' : 
                            isAnswered && isSelectedOption ? 'bg-red-500 border-red-500 text-white' : 
                            'border-gray-300 text-gray-400 group-hover:border-gray-400 group-hover:text-gray-500 bg-white'}
                        `}>
                          {isAnswered && isCorrectOption ? <i className="fa-solid fa-check text-sm"></i> : 
                           isAnswered && isSelectedOption ? <i className="fa-solid fa-xmark text-sm"></i> : 
                           optionLabels[index]}
                        </div>
                        <span className={`text-lg font-medium ${isAnswered && isSelectedOption && !isCorrectOption ? 'text-red-700' : isAnswered && isCorrectOption ? 'text-green-800' : 'text-gray-700'}`}>
                          {option}
                        </span>
                        
                        {isAnswered && isCorrectOption && (
                          <i className="fa-solid fa-circle-check text-2xl text-green-500 ml-auto"></i>
                        )}
                        {isAnswered && isSelectedOption && !isCorrectOption && (
                          <i className="fa-solid fa-circle-xmark text-2xl text-red-500 ml-auto"></i>
                        )}
                      </button>
                    );
                  })}
                </div>

                {isAnswered && (
                  <div className={`p-5 rounded-2xl transition-all duration-300
                    ${selectedOption === currentQuestion.answerIndex ? 'bg-green-50 border border-green-100' : 'bg-red-50 border border-red-100'}
                  `}>
                    <h3 className={`font-bold text-lg mb-2 flex items-center gap-2
                      ${selectedOption === currentQuestion.answerIndex ? 'text-green-700' : 'text-red-700'}
                    `}>
                      {selectedOption === currentQuestion.answerIndex ? '答對了！ 🎉' : '哎呀，答錯了！'}
                    </h3>
                    <p className={`leading-relaxed
                      ${selectedOption === currentQuestion.answerIndex ? 'text-green-800' : 'text-red-800'}
                    `}>
                      {currentQuestion.explanation}
                    </p>
                  </div>
                )}
              </div>

              {/* 固定在底部的按鈕區塊 */}
              {isAnswered && (
                <div className="bg-white border-t border-gray-100 p-4 w-full absolute bottom-0 left-0 rounded-b-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                  <button
                    onClick={handleNextQuestion}
                    className="w-full bg-[#5C55E5] hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-colors flex items-center justify-center gap-2 text-lg"
                  >
                    {currentQuestionIndex < questions.length - 1 ? '下一題' : '查看測驗結果'}
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
